<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0B1120" rx="16"/>
  <rect x="60" y="40" width="680" height="370" fill="#0F172A" stroke="#334155" stroke-width="2" rx="12"/>
  <rect x="60" y="40" width="680" height="44" fill="#162032" rx="12"/>
  <circle cx="90" cy="62" r="6" fill="#EF4444"/>
  <circle cx="110" cy="62" r="6" fill="#F59E0B"/>
  <circle cx="130" cy="62" r="6" fill="#10B981"/>
  <text x="400" y="67" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">ASP.NET Core REST API - OpenAPI / Swagger UI</text>
  
  <rect x="90" y="110" width="100" height="30" fill="#10B981" rx="4"/>
  <text x="140" y="130" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">GET</text>
  <text x="210" y="130" fill="#E2E8F0" font-family="monospace" font-size="14">/api/v1/tasks</text>
  
  <rect x="90" y="155" width="100" height="30" fill="#3B82F6" rx="4"/>
  <text x="140" y="175" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">POST</text>
  <text x="210" y="175" fill="#E2E8F0" font-family="monospace" font-size="14">/api/v1/tasks/create</text>
  
  <rect x="90" y="200" width="100" height="30" fill="#F59E0B" rx="4"/>
  <text x="140" y="220" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">PUT</text>
  <text x="210" y="220" fill="#E2E8F0" font-family="monospace" font-size="14">/api/v1/tasks/{id}</text>
  
  <rect x="90" y="245" width="100" height="30" fill="#EF4444" rx="4"/>
  <text x="140" y="265" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">DELETE</text>
  <text x="210" y="265" fill="#E2E8F0" font-family="monospace" font-size="14">/api/v1/tasks/{id}</text>
  
  <rect x="90" y="300" width="620" height="80" fill="#1E293B" rx="8"/>
  <text x="110" y="330" fill="#34D399" font-family="monospace" font-size="13">HTTP 200 OK — Response Payload: { "status": "success", "count": 24 }</text>
